<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foto Vergroter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0a;
      --surface:  #141414;
      --border:   #2a2a2a;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --success:  #22c55e;
      --text:     #f0f0f0;
      --muted:    #666;
      --radius:   20px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text);
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.3);
      color: var(--accent2);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 99px;
      margin-bottom: 16px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent2);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 400px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── STEP PILLS ── */
    .steps {
      display: flex;
      gap: 6px;
    }

    .step-pill {
      height: 3px;
      flex: 1;
      border-radius: 99px;
      background: var(--border);
      transition: background 0.4s;
    }

    .step-pill.active  { background: var(--accent); }
    .step-pill.done    { background: rgba(108,99,255,0.4); }

    /* ── UPLOAD AREA ── */
    .upload-area {
      width: 100%;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 44px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .upload-area:hover,
    .upload-area.drag-over {
      border-color: var(--accent);
      background: rgba(108,99,255,0.05);
    }

    .upload-icon {
      width: 60px;
      height: 60px;
      background: rgba(108,99,255,0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent2);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .upload-label {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .upload-hint {
      font-size: 13px;
      color: var(--muted);
    }

    #fileInput { display: none; }

    /* ── PREVIEW ── */
    .preview-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1c1c1c;
      border-radius: 14px;
      overflow: hidden;
    }

    .preview-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .file-meta svg {
      width: 14px;
      height: 14px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .file-meta span { word-break: break-all; }

    /* ── BUTTONS ── */
    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.9; }

    .btn-success {
      background: linear-gradient(135deg, #16a34a, var(--success));
      color: #fff;
    }

    .btn-success:hover { opacity: 0.9; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      padding: 14px;
    }

    .btn-ghost:hover {
      border-color: #444;
      color: var(--text);
    }

    /* ── PROGRESS ── */
    .progress-wrap { width: 100%; }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .progress-pct {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── RESULT ── */
    .result-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    .result-icon {
      width: 64px;
      height: 64px;
      background: rgba(34,197,94,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--success);
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .result-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.2);
      color: var(--success);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 99px;
    }

    /* ── HIDDEN ── */
    .hidden { display: none !important; }

    canvas { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge"><span class="badge-dot"></span>4K Resolutie</div>
    <h1>Foto Vergroter</h1>
    <p class="subtitle">Zet elke foto om naar 3840 × 2160</p>
  </div>

  <div class="card">

    <div class="steps">
      <div class="step-pill active" id="dot1"></div>
      <div class="step-pill" id="dot2"></div>
      <div class="step-pill" id="dot3"></div>
    </div>

    <!-- STEP 1: Upload -->
    <div id="step1">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <span class="upload-label">Tik om een foto te kiezen</span>
        <span class="upload-hint">JPG · PNG · WEBP</span>
      </div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
    </div>

    <!-- STEP 2: Preview + Convert -->
    <div id="step2" class="hidden">
      <div class="preview-wrap">
        <img id="previewImg" src="" alt="Voorbeeld" />
      </div>
      <div class="file-meta">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span id="fileName"></span>
      </div>
      <button class="btn btn-primary" id="convertBtn">Omzetten naar 4K</button>
      <button class="btn btn-ghost" id="changeBtn">Andere foto kiezen</button>
    </div>

    <!-- STEP 3: Converting -->
    <div id="step3" class="hidden">
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label" id="progressLabel">Bezig met omzetten…</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <!-- STEP 4: Done -->
    <div id="step4" class="hidden">
      <div class="result-top">
        <div class="result-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p class="result-title">Klaar!</p>
        <span class="result-chip" id="resultInfo">3840 × 2160</span>
      </div>
      <button class="btn btn-success" id="downloadBtn">Download foto</button>
      <button class="btn btn-ghost" id="againBtn">Nieuwe foto omzetten</button>
    </div>

  </div>

  <canvas id="canvas"></canvas>

  <script>
    const fileInput    = document.getElementById('fileInput');
    const uploadArea   = document.getElementById('uploadArea');
    const previewImg   = document.getElementById('previewImg');
    const fileName     = document.getElementById('fileName');
    const convertBtn   = document.getElementById('convertBtn');
    const changeBtn    = document.getElementById('changeBtn');
    const progressFill = document.getElementById('progressFill');
    const progressLabel= document.getElementById('progressLabel');
    const progressPct  = document.getElementById('progressPct');
    const downloadBtn  = document.getElementById('downloadBtn');
    const againBtn     = document.getElementById('againBtn');
    const resultInfo   = document.getElementById('resultInfo');
    const canvas       = document.getElementById('canvas');
    const ctx          = canvas.getContext('2d');

    const TARGET_W = 3840;
    const TARGET_H = 2160;

    let outputBlob = null;
    let outputFileName = 'foto-4k.jpg';

    function showStep(n) {
      [1,2,3,4].forEach(i =>
        document.getElementById('step' + i).classList.toggle('hidden', i !== n)
      );
      const map = { 1:1, 2:2, 3:3, 4:3 };
      [1,2,3].forEach(i => {
        const pill = document.getElementById('dot' + i);
        pill.className = 'step-pill' + (map[n] === i ? ' active' : map[n] > i ? ' done' : '');
      });
    }

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return alert('Kies een afbeeldingsbestand (JPG, PNG of WEBP).');
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        fileName.textContent = file.name;
        outputFileName = file.name.replace(/\.[^.]+$/, '') + '-4k.jpg';
        showStep(2);
      };
      reader.readAsDataURL(file);
    }

    changeBtn.addEventListener('click', () => { fileInput.value = ''; showStep(1); });

    convertBtn.addEventListener('click', () => {
      showStep(3);
      animateProgress(0, 40, 300, () => {
        const img = new Image();
        img.onload = () => {
          animateProgress(40, 70, 200, () => {
            canvas.width  = TARGET_W;
            canvas.height = TARGET_H;

            const scale = Math.max(TARGET_W / img.naturalWidth, TARGET_H / img.naturalHeight);
            const dw = img.naturalWidth  * scale;
            const dh = img.naturalHeight * scale;
            const dx = (TARGET_W - dw) / 2;
            const dy = (TARGET_H - dh) / 2;
            ctx.drawImage(img, dx, dy, dw, dh);

            animateProgress(70, 95, 300, () => {
              canvas.toBlob(blob => {
                outputBlob = blob;
                const sizeMB = (blob.size / 1024 / 1024).toFixed(1);
                resultInfo.textContent = `3840 × 2160 · ${sizeMB} MB`;
                animateProgress(95, 100, 150, () => showStep(4));
              }, 'image/jpeg', 0.95);
            });
          });
        };
        img.src = previewImg.src;
      });
    });

    function animateProgress(from, to, duration, callback) {
      const start = performance.now();
      function tick(now) {
        const t   = Math.min((now - start) / duration, 1);
        const val = from + (to - from) * (1 - Math.pow(1 - t, 2));
        progressFill.style.width = val + '%';
        progressPct.textContent  = Math.round(val) + '%';
        progressLabel.textContent = val < 99 ? 'Bezig met omzetten…' : 'Bijna klaar…';
        if (t < 1) requestAnimationFrame(tick);
        else if (callback) callback();
      }
      requestAnimationFrame(tick);
    }

    downloadBtn.addEventListener('click', () => {
      if (!outputBlob) return;
      const url = URL.createObjectURL(outputBlob);
      const a   = document.createElement('a');
      a.href     = url;
      a.download = outputFileName;
      a.click();
      URL.revokeObjectURL(url);
    });

    againBtn.addEventListener('click', () => {
      fileInput.value = '';
      outputBlob = null;
      progressFill.style.width = '0%';
      progressPct.textContent  = '0%';
      showStep(1);
    });
  </script>
</body>
</html>
